
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show available Xcode targets
        run: |
          xcodebuild -version
          xcodebuild -list -project SocksBypass.xcodeproj

      
      - name: Build without code signing
        run: |
          xcodebuild \
            -project SocksBypass.xcodeproj \
            -target SocksBypass \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build


      
      - name: Package IPA
        run: |
          echo "Searching for compiled iPhone app..."

          APP_PATH=$(find "$PWD/build" \
            -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No compiled .app found"
            find "$PWD/build" -maxdepth 4 -type d
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p "$PWD/Payload"
          cp -R "$APP_PATH" "$PWD/Payload/"

          zip -r SocksBypass-unsigned.ipa Payload


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocksBypass-unsigned
          path: SocksBypass-unsigned.ipa

